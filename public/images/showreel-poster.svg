<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kroo Production showreel</title>
  <desc id="desc">A dark cinematic title card with warm orange light trails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.54" stop-color="#070707"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="34%" r="60%">
      <stop offset="0" stop-color="#ff4d12" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff4d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d12" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ff4d12" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb18a" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="url(#trail)" stroke-width="2">
    <path d="M-80 760 C280 520 530 900 850 560 S1300 250 1710 390"/>
    <path d="M-100 800 C250 580 520 920 850 600 S1300 290 1700 430" opacity=".55"/>
    <path d="M520 -80 C820 170 840 360 1050 470 S1320 670 1680 710" opacity=".38"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".12">
    <path d="M100 100H1500M100 800H1500"/>
    <path d="M100 100V800M1500 100V800"/>
  </g>
  <text x="112" y="690" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900" letter-spacing="2">KROO</text>
  <text x="118" y="752" fill="#ffffff" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="11">PRODUCTION</text>
  <text x="118" y="807" fill="#ff6a36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="6">FILM  /  CULTURE  /  STORY</text>
</svg>
