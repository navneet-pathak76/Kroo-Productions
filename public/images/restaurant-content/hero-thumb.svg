<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Restaurant content visual</title>
  <desc id="desc">Abstract editorial illustration of a plated dish in warm restaurant lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25110b"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f45b22" stop-opacity=".55"/><stop offset="1" stop-color="#f45b22" stop-opacity="0"/></radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e4ca"/><stop offset="1" stop-color="#9d8872"/></linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="690" cy="250" r="430" fill="url(#glow)"/>
  <path d="M0 820 Q280 700 900 840 V1100 H0Z" fill="#120b08"/>
  <ellipse cx="455" cy="670" rx="325" ry="220" fill="#080706" opacity=".8"/>
  <ellipse cx="450" cy="630" rx="315" ry="205" fill="url(#plate)"/>
  <ellipse cx="450" cy="625" rx="260" ry="155" fill="#21150f"/>
  <ellipse cx="450" cy="610" rx="210" ry="112" fill="#d66a31"/>
  <path d="M300 605 Q370 500 465 575 T630 600 Q560 720 420 700 Q340 690 300 605Z" fill="#e8b45b"/>
  <path d="M350 600 Q400 540 455 590 T555 600" fill="none" stroke="#f7df9a" stroke-width="18" stroke-linecap="round"/>
  <g fill="#567447"><ellipse cx="365" cy="565" rx="18" ry="40" transform="rotate(-35 365 565)"/><ellipse cx="535" cy="650" rx="17" ry="38" transform="rotate(38 535 650)"/><ellipse cx="475" cy="540" rx="14" ry="32" transform="rotate(12 475 540)"/></g>
  <g fill="#f6d68d"><circle cx="405" cy="650" r="13"/><circle cx="505" cy="585" r="11"/><circle cx="565" cy="620" r="9"/></g>
  <text x="72" y="120" fill="#ff5a1f" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="8">KROO PRODUCTION</text>
  <text x="72" y="930" fill="#fff" font-family="Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-2">FOOD &amp; HOSPITALITY</text>
  <text x="75" y="980" fill="#c7b8ae" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">VISUAL STORYTELLING</text>
