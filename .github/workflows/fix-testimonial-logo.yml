name: Fix testimonial logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only testimonial avatar placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/home-page.tsx')
          text = path.read_text()

          old = '''            <div className="h-14 w-14 rounded-full bg-gradient-to-br from-white/60 via-zinc-600 to-primary/50" />'''
          new = '''            <div className="h-14 w-14 shrink-0 overflow-hidden rounded-full border border-white/10 bg-black">
              <Image
                src={testimonial.logo}
                alt={testimonial.name}
                width={56}
                height={56}
                className="h-full w-full object-cover"
              />
            </div>'''

          if old not in text:
              raise SystemExit('Expected testimonial avatar placeholder was not found; no changes made.')

          updated = text.replace(old, new, 1)
          path.write_text(updated)
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- components/home-page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/home-page.tsx
          git commit -m "Fix testimonial client logo rendering"
          git push origin HEAD:main

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-testimonial-logo.yml
          git commit -m "Remove temporary logo fix workflow"
          git push origin HEAD:main
